services:
  - type: web
    name: relu-data-extraction-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bonus.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
